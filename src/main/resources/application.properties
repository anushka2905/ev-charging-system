# ══════════════════════════════════════════════════════════════════
#  AI-POWERED EV CHARGING STATION MANAGEMENT SYSTEM
#  application.properties  (production-grade configuration)
# ══════════════════════════════════════════════════════════════════

# ── Application Identity ────────────────────────────────────────
spring.application.name=ev-charging-ai-system

# ── DataSource ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ev_charging?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP defaults)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.evcharging=INFO
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Web / MVC ────────────────────────────────────────────────────
spring.mvc.hiddenmethod.filter.enabled=true

# ── Thymeleaf ────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ══════════════════════════════════════════════════════════════════
#  SPRING AI — OpenAI Configuration
#  Set your API key via environment variable:
#     export SPRING_AI_OPENAI_API_KEY=sk-...
# ══════════════════════════════════════════════════════════════════
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=2048
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ── EV AI System Prompt ──────────────────────────────────────────
ev.ai.system-prompt=You are an intelligent EV Charging Station assistant. \
  You help users find charging stations, understand charging types, \
  manage bookings, and answer questions about electric vehicles. \
  Always be helpful, concise, and accurate. \
  If you don''t know something, say so honestly.

# ── RAG Configuration ────────────────────────────────────────────
ev.rag.documents-path=classpath:documents/
ev.rag.chunk-size=800
ev.rag.chunk-overlap=100
ev.rag.top-k=5
ev.rag.similarity-threshold=0.7

# ── Recommendation Engine ────────────────────────────────────────
ev.recommendation.max-distance-km=50.0
ev.recommendation.max-results=5
ev.recommendation.weight-distance=0.4
ev.recommendation.weight-availability=0.3
ev.recommendation.weight-rating=0.3

# ── Predictive Analytics ─────────────────────────────────────────
ev.analytics.peak-hours=8,9,17,18,19
ev.analytics.forecast-days=7

# ── Jackson ──────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
